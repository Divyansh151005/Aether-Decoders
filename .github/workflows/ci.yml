name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  rtl:
    name: RTL co-sim (Icarus, Blueprint 8/8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: grow -> merge -> peel RTL vs decode_cosim goldens
        run: ./scripts/rtl_decode_sim.sh
      - name: Generated vectors must match the committed goldens
        run: git diff --exit-code -- rtl/gen
